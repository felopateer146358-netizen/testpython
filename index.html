<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Python Master Quiz</title>
<style>
:root{
  --bg:#0a0e1a;--card:#111827;--gold:#f5a623;
  --correct:#10b981;--wrong:#ef4444;
  --text:#f1f5f9;--border:#1e293b;--opt:#1a2236;
  --blue:#3b82f6;--purple:#8b5cf6;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.orb{position:absolute;width:500px;height:500px;border-radius:50%;filter:blur(120px);z-index:-1;opacity:.13;animation:orbmove 9s infinite alternate}
.orb-1{background:var(--gold);top:-15%;left:-15%}
.orb-2{background:var(--blue);bottom:-15%;right:-15%}
.orb-3{background:var(--purple);top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;opacity:.08}
@keyframes orbmove{from{transform:translate(0,0)}to{transform:translate(50px,30px)}}
.orb-3{animation:none}

.wrap{width:95%;max-width:750px;z-index:10}

/* ── CARD ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:44px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.55);text-align:center;display:none}
.card.active{display:block;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),#f97316);border-radius:22px 22px 0 0}

/* ── START ── */
.logo{font-size:52px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--gold),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.logo-sub{color:#64748b;font-size:14px;margin-bottom:28px}
.badge-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.badge{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);color:var(--gold);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700}

/* Settings panel */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px;text-align:left}
.setting-box{background:#0d1424;border:1px solid var(--border);border-radius:12px;padding:14px}
.setting-box label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px}
.setting-box select,.setting-box input[type=range]{width:100%;background:var(--opt);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;outline:none;cursor:pointer}
.setting-box select option{background:var(--card)}
.range-row{display:flex;align-items:center;gap:10px}
.range-val{color:var(--gold);font-weight:800;font-size:16px;min-width:28px;text-align:center}
input[type=range]{accent-color:var(--gold)}

/* ── GAME ── */
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:8px}
.g-left,.g-right{display:flex;gap:10px;align-items:center}
.chip{background:#0d1424;border:1px solid var(--border);border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--gold)}
.chip.timer-chip{min-width:66px;text-align:center}
.chip.timer-chip.warning{color:var(--wrong);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}
.category-tag{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* Progress bar */
.prog-wrap{background:#0d1424;border-radius:999px;height:6px;margin-bottom:24px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--gold),#f97316);border-radius:999px;transition:width .4s ease}

.question-text{font-size:22px;font-weight:700;margin-bottom:28px;line-height:1.45;min-height:66px}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;text-align:left}
.option-btn{background:var(--opt);border:2px solid var(--border);color:white;padding:16px 14px;border-radius:13px;cursor:pointer;font-size:15px;transition:.25s;display:flex;align-items:center;gap:10px;line-height:1.3}
.option-btn:hover:not(:disabled){border-color:var(--gold);background:#1f2d47;transform:translateY(-1px)}
.option-letter{background:rgba(245,166,35,.12);color:var(--gold);padding:4px 9px;border-radius:6px;font-weight:900;font-size:13px;flex-shrink:0}
.correct{border-color:var(--correct)!important;background:rgba(16,185,129,.12)!important}
.wrong{border-color:var(--wrong)!important;background:rgba(239,68,68,.12)!important}
.option-btn:disabled{cursor:not-allowed;opacity:.8}

/* Explanation box */
#explanation{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);font-size:14px;color:#93c5fd;text-align:left;line-height:1.6}
#explanation.show{display:block;animation:fadeUp .3s ease}

.btn-main{background:linear-gradient(135deg,var(--gold),#f97316);color:#000;border:none;padding:15px 40px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:22px;transition:.3s;width:100%;font-size:15px;letter-spacing:.5px}
.btn-main:hover{transform:scale(1.02);box-shadow:0 0 24px rgba(245,166,35,.4)}

/* Lifelines */
.lifeline-row{display:flex;gap:10px;justify-content:center;margin-top:18px}
.ll-btn{background:#0d1424;border:1px solid var(--border);color:var(--gold);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.ll-btn:hover:not(:disabled){background:rgba(245,166,35,.1);border-color:var(--gold)}
.ll-btn:disabled{opacity:.35;cursor:not-allowed}
.ll-btn.used{opacity:.3;text-decoration:line-through}

/* ── RESULT ── */
.result-emoji{font-size:64px;margin-bottom:10px}
.result-title{font-size:30px;font-weight:900;color:var(--gold);margin-bottom:6px}
.score-big{font-size:62px;font-weight:900;margin:10px 0}
.score-sub{color:#64748b;font-size:14px;margin-bottom:22px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-box{background:#0d1424;border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-box .sv{font-size:22px;font-weight:800;color:var(--gold)}
.stat-box .sl{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.high-score-banner{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:12px;padding:12px;margin-bottom:18px;font-size:14px;color:var(--gold);display:none}
.high-score-banner.show{display:block;animation:fadeUp .4s ease}
.btn-row{display:flex;gap:12px}
.btn-secondary{background:transparent;border:2px solid var(--border);color:var(--text);padding:14px;border-radius:12px;font-weight:700;cursor:pointer;flex:1;transition:.2s;font-size:14px}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="wrap">

  <!-- START -->
  <div id="start-screen" class="card active">
    <div class="logo">PYTHON MASTER</div>
    <div class="logo-sub">Felo Edition · 150 Questions Bank</div>
    <div class="badge-row">
      <span class="badge">🐍 150 Questions</span>
      <span class="badge">🎯 5 Categories</span>
      <span class="badge">⏱ Timer Mode</span>
      <span class="badge">💡 Lifelines</span>
    </div>
    <div class="settings-grid">
      <div class="setting-box">
        <label>Number of Questions</label>
        <div class="range-row">
          <input type="range" id="q-count-range" min="5" max="30" step="5" value="10"/>
          <span class="range-val" id="q-count-display">10</span>
        </div>
      </div>
      <div class="setting-box">
        <label>Category</label>
        <select id="cat-select">
          <option value="all">All Categories</option>
          <option value="basics">Basics &amp; Syntax</option>
          <option value="data">Data Types &amp; Structures</option>
          <option value="functions">Functions &amp; OOP</option>
          <option value="advanced">Advanced Python</option>
          <option value="stdlib">Standard Library</option>
        </select>
      </div>
      <div class="setting-box">
        <label>Difficulty</label>
        <select id="diff-select">
          <option value="all">All Levels</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="setting-box">
        <label>Timer per Question</label>
        <select id="timer-select">
          <option value="0">No Timer</option>
          <option value="15">15 seconds</option>
          <option value="20" selected>20 seconds</option>
          <option value="30">30 seconds</option>
          <option value="45">45 seconds</option>
        </select>
      </div>
    </div>
    <button class="btn-main" onclick="startGame()">▶ START QUIZ</button>
  </div>

  <!-- GAME -->
  <div id="game-screen" class="card">
    <div class="game-header">
      <div class="g-left">
        <div class="chip" id="q-label">Q 1/10</div>
        <div class="chip" id="diff-chip">EASY</div>
      </div>
      <div class="g-right">
        <div class="chip timer-chip" id="timer-chip" style="display:none">⏱ 20</div>
        <div class="chip" id="prize-chip">$0</div>
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="category-tag" id="cat-tag">CATEGORY</div>
    <div class="question-text" id="question-text">Loading...</div>
    <div class="options-grid" id="options-grid"></div>
    <div id="explanation"></div>
    <div class="lifeline-row">
      <button class="ll-btn" id="ll-50" onclick="lifeline50()" title="Remove 2 wrong answers">50/50</button>
      <button class="ll-btn" id="ll-skip" onclick="lifelineSkip()" title="Skip this question">⏭ Skip</button>
      <button class="ll-btn" id="ll-hint" onclick="lifelineHint()" title="Show a hint">💡 Hint</button>
    </div>
    <button id="next-btn" class="btn-main" style="display:none" onclick="nextQuestion()">NEXT QUESTION →</button>
  </div>

  <!-- RESULT -->
  <div id="result-screen" class="card">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="result-title" id="result-title">EXCELLENT!</div>
    <div class="score-big" id="final-prize">$0</div>
    <div class="score-sub" id="score-sub">Loading...</div>
    <div class="high-score-banner" id="hs-banner">🎉 New High Score!</div>
    <div class="stats-row">
      <div class="stat-box"><div class="sv" id="r-correct">0</div><div class="sl">Correct</div></div>
      <div class="stat-box"><div class="sv" id="r-wrong">0</div><div class="sl">Wrong</div></div>
      <div class="stat-box"><div class="sv" id="r-acc">0%</div><div class="sl">Accuracy</div></div>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="goStart()">⚙ Settings</button>
      <button class="btn-main" style="flex:2;margin-top:0" onclick="playAgain()">↺ Play Again</button>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════
   150-QUESTION BANK
   Categories: basics | data | functions | advanced | stdlib
   Difficulty: easy | medium | hard
═══════════════════════════════════════ */
const ALL_QUESTIONS = [
  /* ── BASICS & SYNTAX (30) ── */
  {q:"Who created Python?",opts:["James Gosling","Guido van Rossum","Dennis Ritchie","Bjarne Stroustrup"],c:1,cat:"basics",diff:"easy",exp:"Guido van Rossum created Python and released it in 1991."},
  {q:"Which file extension is used for Python?",opts:[".pyt",".pt",".py",".python"],c:2,cat:"basics",diff:"easy",exp:"Python files use the .py extension."},
  {q:"Which keyword starts a function in Python?",opts:["function","def","define","func"],c:1,cat:"basics",diff:"easy",exp:"The 'def' keyword is used to define a function in Python."},
  {q:"Python was first released in?",opts:["1989","1991","1995","2000"],c:1,cat:"basics",diff:"easy",exp:"Python 0.9.0 was released in February 1991."},
  {q:"Symbol used for single-line comments?",opts:["//","/*","#","--"],c:2,cat:"basics",diff:"easy",exp:"In Python, # is used to write single-line comments."},
  {q:"How do you output text in Python?",opts:["echo()","console()","print()","write()"],c:2,cat:"basics",diff:"easy",exp:"print() is Python's built-in function for outputting text."},
  {q:"Is Python case-sensitive?",opts:["No","Only for strings","Yes","Depends on OS"],c:2,cat:"basics",diff:"easy",exp:"Python is fully case-sensitive. 'var' and 'Var' are different identifiers."},
  {q:"What does 'pip' stand for?",opts:["Python Install Pack","Preferred Install Program","Pip Installs Packages","Process Item Plus"],c:2,cat:"basics",diff:"easy",exp:"pip is a recursive acronym: 'Pip Installs Packages'."},
  {q:"Which is a valid Python variable name?",opts:["2var","var-2","var_2","var 2"],c:2,cat:"basics",diff:"easy",exp:"Variable names cannot start with a number, contain hyphens, or have spaces."},
  {q:"Python is primarily?",opts:["Compiled","Interpreted","Both","Neither"],c:1,cat:"basics",diff:"easy",exp:"Python is an interpreted language — code is executed line by line at runtime."},
  {q:"What is PEP 8?",opts:["A module","A style guide","A version","A compiler"],c:1,cat:"basics",diff:"easy",exp:"PEP 8 is Python's official style guide for writing clean, readable code."},
  {q:"How do you import a module?",opts:["get","require","import","include"],c:2,cat:"basics",diff:"easy",exp:"The 'import' keyword is used to include modules in Python."},
  {q:"Correct way to write a multi-line string?",opts:["\"\"\"text\"\"\"","'text'","#text","(text)"],c:0,cat:"basics",diff:"easy",exp:"Triple quotes (\"\"\" or ''') are used for multi-line strings in Python."},
  {q:"What does 'pass' do in Python?",opts:["Exits the program","Does nothing (placeholder)","Skips one iteration","Raises an error"],c:1,cat:"basics",diff:"easy",exp:"'pass' is a null statement used as a placeholder where code is required syntactically."},
  {q:"Which operator is used for exponentiation?",opts:["^","exp()","**","^^"],c:2,cat:"basics",diff:"easy",exp:"In Python, ** is the exponentiation operator. 2**3 = 8."},
  {q:"Output of 2 ** 3?",opts:["6","8","9","5"],c:1,cat:"basics",diff:"easy",exp:"2 ** 3 = 2 × 2 × 2 = 8."},
  {q:"Floor division operator in Python?",opts:["/","//","%","**"],c:1,cat:"basics",diff:"easy",exp:"// performs floor division, e.g. 7 // 2 = 3."},
  {q:"Modulus operator in Python?",opts:["/","//","%","mod"],c:2,cat:"basics",diff:"easy",exp:"% returns the remainder. 7 % 3 = 1."},
  {q:"Operator used to compare two values?",opts:["=","==","===","is"],c:1,cat:"basics",diff:"easy",exp:"== checks equality. = is assignment, === doesn't exist in Python."},
  {q:"Logical AND operator in Python?",opts:["&&","and","&","AND"],c:1,cat:"basics",diff:"easy",exp:"Python uses the keyword 'and' for logical AND operations."},
  {q:"Logical OR operator in Python?",opts:["||","or","|","OR"],c:1,cat:"basics",diff:"easy",exp:"Python uses the keyword 'or' for logical OR operations."},
  {q:"Logical NOT operator in Python?",opts:["!","not","~","NO"],c:1,cat:"basics",diff:"easy",exp:"Python uses the keyword 'not' for logical negation."},
  {q:"Output of 'Hi' * 2?",opts:["HiHi","Hi Hi","Error","2Hi"],c:0,cat:"basics",diff:"easy",exp:"String repetition: 'Hi' * 2 produces 'HiHi'."},
  {q:"Statement to exit a loop?",opts:["stop","exit","break","quit"],c:2,cat:"basics",diff:"easy",exp:"'break' terminates the nearest enclosing loop."},
  {q:"Statement to skip to next iteration?",opts:["skip","next","continue","pass"],c:2,cat:"basics",diff:"easy",exp:"'continue' skips the rest of the current loop iteration."},
  {q:"Keyword for 'else if' in Python?",opts:["else if","elif","ifnot","otherwise"],c:1,cat:"basics",diff:"easy",exp:"Python uses 'elif' instead of 'else if'."},
  {q:"How to check data type of variable x?",opts:["type(x)","typeof(x)","get_type(x)","is_type(x)"],c:0,cat:"basics",diff:"easy",exp:"type() is the built-in function to check an object's type."},
  {q:"Convert integer to string?",opts:["str()","toString()","convert()","text()"],c:0,cat:"basics",diff:"easy",exp:"str() converts an integer (or other type) to a string."},
  {q:"Convert string to integer?",opts:["int()","toInt()","convert()","number()"],c:0,cat:"basics",diff:"easy",exp:"int() converts a string or float to an integer."},
  {q:"What is __name__ == '__main__' used for?",opts:["Naming classes","Running code only when the file is executed directly","Importing modules","Defining main()"],c:1,cat:"basics",diff:"medium",exp:"This idiom allows code to run only when the script is executed directly, not when imported."},

  /* ── DATA TYPES & STRUCTURES (30) ── */
  {q:"Which data type is immutable?",opts:["List","Dictionary","Set","Tuple"],c:3,cat:"data",diff:"easy",exp:"Tuples are immutable — they cannot be changed after creation."},
  {q:"Correct way to create a list?",opts:["[]","{}","()","<>"],c:0,cat:"data",diff:"easy",exp:"Lists are created with square brackets []."},
  {q:"Which creates a Python dictionary?",opts:["[]","{}","()","set()"],c:1,cat:"data",diff:"easy",exp:"Dictionaries are created with curly braces {key: value}."},
  {q:"Which is NOT a number type in Python?",opts:["int","float","complex","string"],c:3,cat:"data",diff:"easy",exp:"string (str) is not a numeric type. int, float, and complex are."},
  {q:"How to create a set in Python?",opts:["set[]","set()","[]","( )"],c:1,cat:"data",diff:"easy",exp:"Sets are created with set() or curly braces {1,2,3}."},
  {q:"Empty set is created by?",opts:["{}","set()","set{}","[]"],c:1,cat:"data",diff:"medium",exp:"{} creates an empty dict, not a set. set() creates an empty set."},
  {q:"What is a Tuple?",opts:["Mutable ordered list","Immutable ordered sequence","A key-value store","An unordered collection"],c:1,cat:"data",diff:"easy",exp:"A tuple is an immutable, ordered sequence of elements."},
  {q:"Which collection does NOT allow duplicates?",opts:["List","Tuple","Set","Dictionary values"],c:2,cat:"data",diff:"easy",exp:"Sets automatically remove duplicate values."},
  {q:"How to get the length of a list?",opts:["len()","size()","count()","length()"],c:0,cat:"data",diff:"easy",exp:"len() returns the number of items in any sequence or collection."},
  {q:"Method to add an item to a list?",opts:["add()","push()","append()","insert()"],c:2,cat:"data",diff:"easy",exp:"append() adds a single item to the end of a list."},
  {q:"Method to remove the last item from a list?",opts:["delete()","pop()","remove()","discard()"],c:1,cat:"data",diff:"easy",exp:"pop() removes and returns the last item (or item at index) from a list."},
  {q:"Which is a Floating point number?",opts:["1","1.0","1+0j","True"],c:1,cat:"data",diff:"easy",exp:"1.0 is a float. 1 is int, 1+0j is complex, True is bool."},
  {q:"Boolean values in Python start with?",opts:["Lower case","Capital letter","Underscore","Symbols"],c:1,cat:"data",diff:"easy",exp:"Python Booleans are True and False — both start with a capital letter."},
  {q:"Value of True + True in Python?",opts:["0","1","2","Error"],c:2,cat:"data",diff:"medium",exp:"In Python, True is 1 and False is 0. So True + True = 1 + 1 = 2."},
  {q:"What is None in Python?",opts:["False","0","A special null object","An empty string"],c:2,cat:"data",diff:"easy",exp:"None is Python's null object, representing the absence of a value."},
  {q:"Dictionary key must be?",opts:["Mutable","Immutable","Any type","Numbers only"],c:1,cat:"data",diff:"medium",exp:"Dictionary keys must be immutable (strings, numbers, tuples are valid keys)."},
  {q:"What does 'slicing' do?",opts:["Deletes items","Extracts a portion of a sequence","Joins lists","Sorts elements"],c:1,cat:"data",diff:"easy",exp:"Slicing extracts a sub-sequence using [start:stop:step] notation."},
  {q:"Output of [1,2,3][1:3]?",opts:["[1,2]","[2,3]","[1,2,3]","[3]"],c:1,cat:"data",diff:"medium",exp:"Slicing [1:3] means from index 1 up to (not including) 3, giving [2,3]."},
  {q:"How to reverse a list in place?",opts:["list.reverse()","reversed(list)","list[::-1]","list.sort(reverse=True)"],c:0,cat:"data",diff:"medium",exp:"list.reverse() reverses the list in-place. reversed() returns an iterator."},
  {q:"Which list method sorts in place?",opts:["sort()","ordered()","arrange()","sorted()"],c:0,cat:"data",diff:"easy",exp:"list.sort() sorts the list in place. sorted() returns a new sorted list."},
  {q:"How to merge two dictionaries in Python 3.9+?",opts:["dict1 + dict2","dict1 | dict2","dict1.merge(dict2)","merge(dict1, dict2)"],c:1,cat:"data",diff:"hard",exp:"The | operator merges dictionaries in Python 3.9+."},
  {q:"Output of list('abc')?",opts:["['abc']","['a','b','c']","('a','b','c')","Error"],c:1,cat:"data",diff:"medium",exp:"list() on a string creates a list of individual characters."},
  {q:"How to copy a list safely?",opts:["list2 = list1","list2 = list1.copy()","list2 = list1[:]","Both B and C"],c:3,cat:"data",diff:"medium",exp:"Both .copy() and [:] create shallow copies. Assignment just copies the reference."},
  {q:"What does dict.get('key', default) do?",opts:["Raises KeyError if missing","Returns default if key missing","Adds the key","Returns None always"],c:1,cat:"data",diff:"medium",exp:"dict.get() safely retrieves a value, returning the default if the key doesn't exist."},
  {q:"How to get all keys from a dictionary?",opts:["dict.keys()","dict.getkeys()","keys(dict)","dict.all()"],c:0,cat:"data",diff:"easy",exp:"dict.keys() returns a view of all keys in the dictionary."},
  {q:"String method to remove leading/trailing whitespace?",opts:["clean()","strip()","trim()","cut()"],c:1,cat:"data",diff:"easy",exp:"strip() removes whitespace from both ends. lstrip() and rstrip() for one side."},
  {q:"What is an f-string?",opts:["Function string","Formatted string literal","Fixed string","Fast string"],c:1,cat:"data",diff:"easy",exp:"f-strings (f'...') allow inline expression evaluation inside string literals."},
  {q:"String method to join a list?",opts:["join()","merge()","concat()","add()"],c:0,cat:"data",diff:"easy",exp:"'separator'.join(list) joins list elements into a string."},
  {q:"Output of 'python'.upper()?",opts:["Python","PYTHON","python","PYthon"],c:1,cat:"data",diff:"easy",exp:".upper() converts all characters to uppercase."},
  {q:"What does enumerate() do?",opts:["Counts elements","Returns index-value pairs","Sorts a list","Filters a list"],c:1,cat:"data",diff:"medium",exp:"enumerate() returns an iterator of (index, value) tuples for a sequence."},

  /* ── FUNCTIONS & OOP (30) ── */
  {q:"Keyword to create a class?",opts:["object","define","class","new"],c:2,cat:"functions",diff:"easy",exp:"'class' keyword is used to define a class in Python."},

/* ═══════════════════════════════════════
   SETTINGS & STATE
═══════════════════════════════════════ */
let questions=[], idx=0, score=0, correct=0, wrong=0;
let canAnswer=true, timerSecs=0, timerInterval=null;
let ll50Used=false, llSkipUsed=false, llHintUsed=false;
let totalQ=10;
const PRIZE_PER_Q=10000;
const DIFF_COLORS={easy:'#10b981',medium:'#f5a623',hard:'#ef4444'};
const CAT_LABELS={basics:'Basics & Syntax',data:'Data Types',functions:'Functions & OOP',advanced:'Advanced',stdlib:'Standard Library'};

// High score
function getHS(){return parseInt(localStorage.getItem('pyquiz_hs')||'0');}
function setHS(v){localStorage.setItem('pyquiz_hs',String(v));}

// Settings UI
const qRange=document.getElementById('q-count-range');
const qDisp=document.getElementById('q-count-display');
qRange.addEventListener('input',()=>{qDisp.textContent=qRange.value;});

function startGame(){
  const cat=document.getElementById('cat-select').value;
  const diff=document.getElementById('diff-select').value;
  timerSecs=parseInt(document.getElementById('timer-select').value);
  totalQ=parseInt(qRange.value);

  let pool=ALL_QUESTIONS.filter(q=>{
    if(cat!=='all'&&q.cat!==cat)return false;
    if(diff!=='all'&&q.diff!==diff)return false;
    return true;
  });
  if(pool.length<totalQ)pool=[...ALL_QUESTIONS];
  questions=pool.sort(()=>Math.random()-.5).slice(0,totalQ);

  idx=0;score=0;correct=0;wrong=0;
  ll50Used=false;llSkipUsed=false;llHintUsed=false;
  resetLifelines();

  show('game-screen');
  loadQuestion();
}

function loadQuestion(){
  canAnswer=true;
  clearInterval(timerInterval);
  const d=questions[idx];

  // Header
  document.getElementById('q-label').textContent=`Q ${idx+1}/${totalQ}`;
  document.getElementById('diff-chip').textContent=d.diff.toUpperCase();
  document.getElementById('diff-chip').style.color=DIFF_COLORS[d.diff]||'var(--gold)';
  document.getElementById('prize-chip').textContent='$'+score.toLocaleString();
  document.getElementById('cat-tag').textContent=CAT_LABELS[d.cat]||d.cat;

  // Progress
  document.getElementById('prog-bar').style.width=((idx/totalQ)*100)+'%';

  // Question & options
  document.getElementById('question-text').textContent=d.q;
  document.getElementById('next-btn').style.display='none';
  document.getElementById('explanation').className='';
  document.getElementById('explanation').style.display='none';

  const grid=document.getElementById('options-grid');
  grid.innerHTML='';
  d.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.id='opt-'+i;
    btn.innerHTML=`<span class="option-letter">${String.fromCharCode(65+i)}</span> ${opt}`;
    btn.onclick=()=>checkAnswer(i,btn);
    grid.appendChild(btn);
  });

  // Timer
  const tc=document.getElementById('timer-chip');
  if(timerSecs>0){
    tc.style.display='';
    let rem=timerSecs;
    tc.textContent='⏱ '+rem;
    tc.className='chip timer-chip';
    timerInterval=setInterval(()=>{
      rem--;
      tc.textContent='⏱ '+rem;
      if(rem<=5)tc.classList.add('warning');
      if(rem<=0){clearInterval(timerInterval);timeUp();}
    },1000);
  } else {tc.style.display='none';}
}

function timeUp(){
  if(!canAnswer)return;
  canAnswer=false;
  const d=questions[idx];
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
  document.getElementById('opt-'+d.c).classList.add('correct');
  showExplanation(d.exp);
  wrong++;
  document.getElementById('next-btn').style.display='block';
}

function checkAnswer(i,btn){
  if(!canAnswer)return;
  canAnswer=false;
  clearInterval(timerInterval);
  const d=questions[idx];
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
  if(i===d.c){
    btn.classList.add('correct');
    score+=PRIZE_PER_Q;
    correct++;
    document.getElementById('prize-chip').textContent='$'+score.toLocaleString();
  } else {
    btn.classList.add('wrong');
    document.getElementById('opt-'+d.c).classList.add('correct');
    wrong++;
  }
  showExplanation(d.exp);
  document.getElementById('next-btn').style.display='block';
}

function showExplanation(text){
  const el=document.getElementById('explanation');
  el.textContent='💡 '+text;
  el.style.display='block';
  el.className='show';
}

function nextQuestion(){
  idx++;
  if(idx<totalQ){loadQuestion();}
  else{showResult();}
}

function showResult(){
  clearInterval(timerInterval);
  document.getElementById('prog-bar').style.width='100%';

  const pct=Math.round((correct/totalQ)*100);
  document.getElementById('final-prize').textContent='$'+score.toLocaleString();
  document.getElementById('score-sub').textContent=`${correct} correct of ${totalQ} questions`;
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=wrong;
  document.getElementById('r-acc').textContent=pct+'%';

  // Emoji & title
  let emoji,title;
  if(pct===100){emoji='🏆';title='PERFECT SCORE!';}
  else if(pct>=80){emoji='🎉';title='EXCELLENT!';}
  else if(pct>=60){emoji='👏';title='GOOD JOB!';}
  else if(pct>=40){emoji='📚';title='KEEP LEARNING!';}
  else{emoji='💪';title='PRACTICE MORE!';}
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-title').textContent=title;

  // High score
  const hs=getHS();
  const banner=document.getElementById('hs-banner');
  if(score>hs){setHS(score);banner.textContent='🎉 New High Score: $'+score.toLocaleString()+'!';banner.className='high-score-banner show';}
  else{banner.className='high-score-banner';}

  show('result-screen');
}

/* ── Lifelines ── */
function resetLifelines(){
  ['ll-50','ll-skip','ll-hint'].forEach(id=>{
    const b=document.getElementById(id);b.disabled=false;b.classList.remove('used');
  });
}

function lifeline50(){
  if(ll50Used||!canAnswer)return;
  ll50Used=true;
  document.getElementById('ll-50').classList.add('used');
  document.getElementById('ll-50').disabled=true;
  const d=questions[idx];
  const btns=document.querySelectorAll('.option-btn');
  let removed=0;
  btns.forEach((b,i)=>{
    if(i!==d.c&&removed<2){b.style.opacity='.25';b.disabled=true;removed++;}
  });
}

function lifelineSkip(){
  if(llSkipUsed||!canAnswer)return;
  llSkipUsed=true;
  document.getElementById('ll-skip').classList.add('used');
  document.getElementById('ll-skip').disabled=true;
  clearInterval(timerInterval);
  canAnswer=false;
  idx++;
  if(idx<totalQ)loadQuestion();else showResult();
}

function lifelineHint(){
  if(llHintUsed||!canAnswer)return;
  llHintUsed=true;
  document.getElementById('ll-hint').classList.add('used');
  document.getElementById('ll-hint').disabled=true;
  const d=questions[idx];
  showExplanation('HINT: '+d.exp.slice(0,80)+'...');
}

/* ── Navigation ── */
function show(id){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goStart(){clearInterval(timerInterval);show('start-screen');}
function playAgain(){clearInterval(timerInterval);startGame();}
</script>
</body>
</html>
